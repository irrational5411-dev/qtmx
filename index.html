<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Riyad Studio V9 专业排版引擎</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ==========================================
           CSS/BASE & THEME (模拟文件: /css/base.css, /css/theme.css)
           ========================================== */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Caveat:wght@500;700&family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif+KR:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            height: 100vh;
            overflow: hidden;
            background-color: #FAF6F0;
        }
        .dark body { background-color: #1E1B18; color: #EFEAE2; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .cream-button { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .cream-button:active { transform: scale(0.96); }

        /* ==========================================
           CSS/LAYOUT & DRAWER (模拟文件: /css/layout.css, /css/drawer.css)
           ========================================== */
        #app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        #preview-panel {
            flex: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative;
            background: linear-gradient(180deg, rgba(139,115,85,0.03) 0%, rgba(139,115,85,0.08) 100%);
            padding-bottom: 72px; overflow: hidden;
        }
        .dark #preview-panel { background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 100%); }
        #preview-canvas { touch-action: none; }
        
        #editor-panel {
            position: absolute; bottom: 64px; left: 0; width: 100%; height: 44vh; min-height: 60px; max-height: 85vh;
            background-color: #FFFFFF; border-radius: 32px 32px 0 0;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.12); display: flex; flex-direction: column; z-index: 35;
            /* 移除过渡，交给 JS 完全控制以实现顺滑物理拖拽 */
        }
        .dark #editor-panel { background-color: #282421; box-shadow: 0 -15px 40px rgba(0,0,0,0.5); }
        
        #editor-handle-bar { width: 100%; padding: 12px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex-shrink: 0; }
        #editor-handle { width: 44px; height: 5px; background: #D1C7BD; border-radius: 10px; }
        .dark #editor-handle { background: #524942; }

        #bottom-nav-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 64px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);
            border-top: 1px solid #EFEAE2; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; z-index: 40;
        }
        .dark #bottom-nav-bar { background: rgba(40, 36, 33, 0.95); border-top: 1px solid #3E3834; }
        
        .tab-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8C827B; font-size: 11px; font-weight: 500; transition: all 0.2s ease; }
        .tab-btn.active { color: #8B7355; font-weight: 700; }
        .dark .tab-btn.active { color: #70FFFF; }

        @media (min-width: 1024px), (orientation: landscape) and (max-height: 700px) {
            #app { flex-direction: row; }
            #preview-panel { width: 55%; height: 100vh; flex: none; padding-bottom: 0; }
            #editor-panel { position: relative; bottom: auto; left: auto; width: 45%; height: 100vh; border-radius: 0; box-shadow: none; min-height: auto; }
            #bottom-nav-bar, #editor-handle-bar { display: none !important; }
            .tab-pane { display: flex !important; }
        }
    </style>
</head>
<body>
    <!-- 预加载字体 -->
    <div style="position:absolute; opacity:0; pointer-events:none;">
        <span style="font-family: 'Cinzel';">preload</span>
        <span style="font-family: 'Caveat';">preload</span>
        <span style="font-family: 'Noto Serif SC';">预加载</span>
        <span style="font-family: 'Noto Serif JP';">プレロード</span>
        <span style="font-family: 'Noto Serif KR';">미리 불러오기</span>
    </div>

    <!-- UI DOM (完全解耦状态) -->
    <div id="app">
        <header class="shrink-0 bg-white/80 dark:bg-[#282421]/80 backdrop-blur-md border-b border-[#EFEAE2] dark:border-[#3E3834] px-4 py-2.5 flex items-center justify-between z-40">
            <div class="flex items-center gap-2">
                <span class="p-1.5 bg-[#8B7355] dark:bg-[#70FFFF] dark:text-[#1E1B18] rounded-lg text-white">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                </span>
                <span class="text-sm font-bold tracking-wider">RIYAD V9 ENGINE</span>
            </div>
            
            <div class="flex items-center gap-1.5">
                <button id="btn-undo" class="p-2 rounded-full bg-[#FAF6F0] dark:bg-[#35302C] text-[#4A3E3D] dark:text-[#EFEAE2] cream-button disabled:opacity-30" title="撤销">
                    <i data-lucide="undo-2" class="w-4 h-4"></i>
                </button>
                <button id="btn-redo" class="p-2 rounded-full bg-[#FAF6F0] dark:bg-[#35302C] text-[#4A3E3D] dark:text-[#EFEAE2] cream-button disabled:opacity-30" title="重做">
                    <i data-lucide="redo-2" class="w-4 h-4"></i>
                </button>
                <div class="w-[1px] h-4 bg-zinc-300 dark:bg-zinc-700 mx-1"></div>
                <button id="btn-theme-toggle" class="p-2 rounded-full bg-[#FAF6F0] dark:bg-[#35302C] text-[#4A3E3D] dark:text-[#70FFFF] cream-button" title="切换深色/浅色模式">
                    <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
                    <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                </button>
                <button id="btn-sample-assets" class="text-xs bg-[#8B7355]/10 dark:bg-[#70FFFF]/20 text-[#8B7355] dark:text-[#70FFFF] border border-[#8B7355]/30 dark:border-[#70FFFF]/40 px-3 py-1.5 rounded-full font-medium flex items-center gap-1 cream-button">
                    <i data-lucide="wand-2" class="w-3.5 h-3.5"></i> 样图
                </button>
            </div>
        </header>

        <section id="preview-panel">
            <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-40">
                <div class="absolute w-[250px] h-[250px] rounded-full bg-[#E8DCC4] dark:bg-[#1E3838] blur-[80px] top-1/4 left-1/3 animate-pulse"></div>
                <div class="absolute w-[300px] h-[300px] rounded-full bg-[#E6D0BE] dark:bg-[#152E2E] blur-[100px] bottom-1/4 right-1/4"></div>
            </div>

            <div id="workspace" class="relative bg-white dark:bg-[#282421] shadow-[0_20px_50px_-15px_rgba(139,115,85,0.15)] dark:shadow-[0_20px_50px_-15px_rgba(0,0,0,0.5)] overflow-hidden transition-all duration-300 flex items-center justify-center border border-[#EFEAE2] dark:border-[#3E3834]" style="width: 320px; height: 568px; border-radius: 12px;">
                <div id="workspace-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-[#FAF6F0]/95 dark:bg-[#282421]/95 z-30 gap-2 transition-opacity duration-300">
                    <div class="w-12 h-12 rounded-full bg-[#8B7355]/10 border border-[#8B7355]/20 flex items-center justify-center text-[#8B7355] dark:text-[#70FFFF]">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </div>
                    <span class="text-[11px] text-zinc-400 font-medium">Riyad V9 Core Engine</span>
                </div>
                <canvas id="preview-canvas" class="w-full h-full cursor-move border-0 block"></canvas>
            </div>
        </section>

        <section id="editor-panel">
            <div id="editor-handle-bar">
                <div id="editor-handle"></div>
                <div class="w-3 h-3 text-zinc-400 -mt-1"><i data-lucide="chevron-up" class="w-3 h-3" id="handle-icon"></i></div>
            </div>

            <div class="flex-1 overflow-y-auto px-5 pb-24 flex flex-col gap-4 no-scrollbar">
                <!-- Tab Pane 1: 照片 -->
                <div class="tab-pane flex flex-col gap-3" data-pane="photo">
                    <span class="text-[11px] font-bold text-[#8B7355] dark:text-[#70FFFF] uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="image-plus" class="w-3.5 h-3.5"></i> 素材与上传
                    </span>

                    <div id="panel-inverse-controls" class="flex flex-col gap-3 hidden">
                        <div class="grid grid-cols-2 gap-2.5">
                            <div class="relative">
                                <input type="file" id="upload-a" accept="image/*" class="hidden">
                                <label for="upload-a" class="flex flex-col items-center justify-center h-20 border border-dashed border-[#CBBFB0] dark:border-[#524942] hover:border-[#8B7355] dark:hover:border-[#70FFFF] rounded-xl cursor-pointer bg-[#FAF6F0] dark:bg-[#35302C] transition-all overflow-hidden relative">
                                    <div id="preview-container-a" class="absolute inset-0 w-full h-full hidden"><img id="img-thumb-a" class="w-full h-full object-cover"></div>
                                    <div id="placeholder-a" class="flex flex-col items-center justify-center text-center p-1"><i data-lucide="plus" class="w-4 h-4 text-[#8B7355] dark:text-[#70FFFF]"></i><span class="text-[11px] font-medium mt-0.5">图 A</span></div>
                                </label>
                            </div>
                            <div class="relative">
                                <input type="file" id="upload-b" accept="image/*" class="hidden">
                                <label for="upload-b" class="flex flex-col items-center justify-center h-20 border border-dashed border-[#CBBFB0] dark:border-[#524942] hover:border-[#8B7355] dark:hover:border-[#70FFFF] rounded-xl cursor-pointer bg-[#FAF6F0] dark:bg-[#35302C] transition-all overflow-hidden relative">
                                    <div id="preview-container-b" class="absolute inset-0 w-full h-full hidden"><img id="img-thumb-b" class="w-full h-full object-cover"></div>
                                    <div id="placeholder-b" class="flex flex-col items-center justify-center text-center p-1"><i data-lucide="plus" class="w-4 h-4 text-[#8B7355] dark:text-[#70FFFF]"></i><span class="text-[11px] font-medium mt-0.5">图 B</span></div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div id="panel-story-controls" class="flex flex-col gap-3">
                        <div class="flex flex-col gap-1.5">
                            <div class="relative">
                                <input type="file" id="upload-story-bg" accept="image/*" class="hidden">
                                <label for="upload-story-bg" class="flex items-center justify-between px-3 py-2.5 border border-dashed border-[#CBBFB0] dark:border-[#524942] hover:border-[#8B7355] dark:hover:border-[#70FFFF] rounded-xl cursor-pointer bg-[#FAF6F0] dark:bg-[#35302C]">
                                    <span class="text-xs font-medium flex items-center gap-2"><i data-lucide="upload" class="w-4 h-4 text-[#8B7355] dark:text-[#70FFFF]"></i> 背景图片</span>
                                    <span id="story-bg-status" class="text-[10px] text-zinc-400">未选择</span>
                                </label>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <span class="text-[11px] font-bold text-[#8B7355] dark:text-[#70FFFF]">引擎网格布局</span>
                            <div class="grid grid-cols-4 gap-1.5">
                                <button data-layout="1" class="btn-story-layout py-1.5 text-xs rounded-xl bg-[#FAF6F0] dark:bg-[#35302C] font-medium">单图</button>
                                <button data-layout="2-v" class="btn-story-layout py-1.5 text-xs rounded-xl bg-[#FAF6F0] dark:bg-[#35302C] font-medium">双图列</button>
                                <button data-layout="2-2" class="btn-story-layout py-1.5 text-xs rounded-xl bg-[#8B7355] dark:bg-[#70FFFF] dark:text-[#1E1B18] text-white font-bold shadow-sm">4宫格</button>
                                <button data-layout="2-3" class="btn-story-layout py-1.5 text-xs rounded-xl bg-[#FAF6F0] dark:bg-[#35302C] font-medium">6宫格</button>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <span class="text-[11px] font-bold text-[#8B7355] dark:text-[#70FFFF] flex items-center justify-between">
                                <span>分层图片注入</span>
                                <label for="upload-story-grid-multi" class="text-[10px] text-[#8B7355] dark:text-[#70FFFF] font-normal cursor-pointer underline">批量</label>
                                <input type="file" id="upload-story-grid-multi" accept="image/*" multiple class="hidden">
                            </span>
                            <div id="story-grid-upload-cells" class="grid grid-cols-4 gap-2"></div>
                        </div>
                    </div>
                </div>

                <!-- Tab Pane 2: 样式 -->
                <div class="tab-pane flex flex-col gap-3 hidden" data-pane="style">
                    <div class="flex flex-col gap-2">
                        <span class="text-[11px] font-bold text-[#8B7355] dark:text-[#70FFFF] uppercase tracking-wider flex items-center gap-1">
                            <i data-lucide="layout-template" class="w-3.5 h-3.5"></i> V9 模式与比例
                        </span>
                        <div class="grid grid-cols-2 gap-2 mb-1">
                            <button data-mode="inverse" class="btn-mode py-2 px-2 text-xs rounded-xl bg-[#FAF6F0] dark:bg-[#35302C] text-[#4A3E3D] dark:text-[#EFEAE2] font-bold transition-all cream-button flex items-center justify-center gap-1.5"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 镜像模式</button>
                            <button data-mode="story" class="btn-mode py-2 px-2 text-xs rounded-xl bg-[#8B7355] dark:bg-[#70FFFF] dark:text-[#1E1B18] text-white font-bold transition-all cream-button shadow-sm flex items-center justify-center gap-1.5"><i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> 拼图模式</button>
                        </div>
                        <div id="ratio-cards-group" class="grid grid-cols-3 gap-2"></div>
                    </div>

                    <div class="flex flex-col gap-2.5 pt-2 border-t border-[#EFEAE2] dark:border-[#433B35]">
                        <span class="text-[11px] font-bold text-[#8B7355] dark:text-[#70FFFF] uppercase tracking-wider flex items-center gap-1">
                            <i data-lucide="sliders" class="w-3.5 h-3.5"></i> 参数注入
                        </span>
                        <div class="bg-[#FAF6F0] dark:bg-[#35302C] p-3 rounded-2xl border border-[#EFEAE2] dark:border-[#433B35] flex flex-col gap-2.5">
                            <div class="flex justify-between text-xs mb-0.5 font-medium"><span>中央区占比 (Size)</span><span id="val-centerSize" class="text-[#8B7355] dark:text-[#70FFFF] font-bold">55%</span></div>
                            <input type="range" id="input-centerSize" data-state-key="settings.centerSize" min="20" max="85" value="55" class="w-full h-1 bg-zinc-200 dark:bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-[#8B7355] dark:accent-[#70FFFF]">
                            
                            <div id="row-gridGap" class="border-t border-[#EFEAE2] dark:border-[#433B35] pt-2 flex flex-col gap-1.5">
                                <div class="flex justify-between text-[11px] font-medium"><span>间距 (Gap)</span><span id="val-gridGap" class="text-[#8B7355] dark:text-[#70FFFF] font-bold">2px</span></div>
                                <input type="range" id="input-gridGap" data-state-key="settings.gridGap" min="0" max="20" value="2" class="w-full h-1 bg-zinc-200 dark:bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-[#8B7355] dark:accent-[#70FFFF]">
                            </div>

                            <div class="border-t border-[#EFEAE2] dark:border-[#433B35] pt-2 flex flex-col gap-1.5">
                                <div class="flex justify-between text-[11px] font-medium"><span>边框 (Border)</span><span id="val-borderWidth" class="text-[#8B7355] dark:text-[#70FFFF] font-bold">0px</span></div>
                                <input type="range" id="input-borderWidth" data-state-key="settings.borderWidth" min="0" max="16" value="0" class="w-full h-1 bg-zinc-200 dark:bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-[#8B7355] dark:accent-[#70FFFF]">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div class="bg-[#FAF6F0] dark:bg-[#35302C] p-2.5 rounded-2xl border border-[#EFEAE2] dark:border-[#433B35] flex flex-col justify-between">
                                <div class="flex justify-between text-[11px] mb-1 font-semibold"><span>圆角 (Corner)</span><span id="val-radius" class="text-[#8B7355] dark:text-[#70FFFF]">0px</span></div>
                                <input type="range" id="input-radius" data-state-key="settings.radius" min="0" max="24" value="0" class="w-full h-1 bg-zinc-200 dark:bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-[#8B7355] dark:accent-[#70FFFF]">
                            </div>
                            <div class="bg-[#FAF6F0] dark:bg-[#35302C] p-2.5 rounded-2xl border border-[#EFEAE2] dark:border-[#433B35] flex flex-col justify-between">
                                <div class="flex justify-between text-[11px] mb-1 font-semibold"><span>噪点 (Grain)</span><span id="val-grain" class="text-[#8B7355] dark:text-[#70FFFF]">6%</span></div>
                                <input type="range" id="input-grain" data-state-key="settings.grain" min="0" max="15" value="6" class="w-full h-1 bg-zinc-200 dark:bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-[#8B7355] dark:accent-[#70FFFF]">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab Pane 3: 文字 -->
                <div class="tab-pane flex flex-col gap-3 hidden" data-pane="text">
                    <span class="text-[11px] font-bold text-[#8B7355] dark:text-[#70FFFF] uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="type" class="w-3.5 h-3.5"></i> 文本引擎模块
                    </span>
                    <div class="bg-[#FAF6F0] dark:bg-[#35302C] p-3.5 rounded-2xl border border-[#EFEAE2] dark:border-[#433B35] flex flex-col gap-3.5">
                        
                        <div class="flex flex-col gap-1.5">
                            <div class="flex items-center justify-between">
                                <label class="text-[10px] font-bold text-[#8B7355] dark:text-[#70FFFF]">① 日期渲染层</label>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="input-dateShow" data-state-key="text.date.show" class="sr-only peer">
                                    <div class="w-7 h-4 bg-zinc-300 dark:bg-zinc-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-[#8B7355] dark:peer-checked:bg-[#70FFFF]"></div>
                                </label>
                            </div>
                            <div class="flex gap-2">
                                <input type="date" id="input-dateRaw" data-state-key="text.date.raw" class="flex-1 bg-white dark:bg-[#282421] border border-[#EFEAE2] dark:border-[#433B35] rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-[#8B7355]">
                                <select id="input-dateFormat" data-state-key="text.date.format" class="w-36 bg-white dark:bg-[#282421] border border-[#EFEAE2] dark:border-[#433B35] rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-[#8B7355]">
                                    <option value="DD MMM YYYY">DD MMM YYYY</option>
                                    <option value="YYYY.MM.DD">YYYY.MM.DD</option>
                                    <option value="MM/DD/YYYY">MM/DD/YYYY</option>
                                    <option value="Month DD, YYYY">Month DD, YYYY</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex flex-col gap-1.5 pt-2.5 border-t border-[#EFEAE2] dark:border-[#433B35]">
                            <div class="flex items-center justify-between">
                                <label class="text-[10px] font-bold text-[#8B7355] dark:text-[#70FFFF]">② 自定义文本层</label>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="input-freeShow" data-state-key="text.free.show" class="sr-only peer">
                                    <div class="w-7 h-4 bg-zinc-300 dark:bg-zinc-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-[#8B7355] dark:peer-checked:bg-[#70FFFF]"></div>
                                </label>
                            </div>
                            <div class="flex gap-2">
                                <input type="text" id="input-freeText" data-state-key="text.free.text" placeholder="输入文字..." class="w-3/5 bg-white dark:bg-[#282421] border border-[#EFEAE2] dark:border-[#433B35] rounded-lg px-2.5 py-1.5 text-xs focus:outline-none">
                                <select id="input-freeFont" data-state-key="text.free.fontFamily" class="w-2/5 bg-white dark:bg-[#282421] border border-[#EFEAE2] dark:border-[#433B35] rounded-lg px-1 py-1.5 text-xs focus:outline-none">
                                    <option value="Cinzel">英·衬线</option><option value="Caveat">英·手写</option><option value="Noto Serif SC">中·思源宋</option>
                                    <option value="Noto Serif JP">日·明朝</option><option value="Noto Serif KR">韩·宋体</option><option value="Inter">现代无衬线</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex flex-col gap-2 pt-2.5 border-t border-[#EFEAE2] dark:border-[#433B35]">
                            <div class="flex items-center justify-between text-[11px] font-medium"><span>快捷坐标系预设</span></div>
                            <div class="grid grid-cols-5 gap-1">
                                <button data-pos="top" class="btn-text-pos bg-white dark:bg-[#282421] border border-zinc-200 dark:border-zinc-700 py-1 rounded text-[10px] hover:opacity-80">顶部</button>
                                <button data-pos="above" class="btn-text-pos bg-white dark:bg-[#282421] border border-zinc-200 dark:border-zinc-700 py-1 rounded text-[10px] hover:opacity-80">中上</button>
                                <button data-pos="center" class="btn-text-pos bg-white dark:bg-[#282421] border border-zinc-200 dark:border-zinc-700 py-1 rounded text-[10px] hover:opacity-80">中央</button>
                                <button data-pos="below" class="btn-text-pos bg-white dark:bg-[#282421] border border-zinc-200 dark:border-zinc-700 py-1 rounded text-[10px] hover:opacity-80">中下</button>

                    </span>
                    <div class="bg-[#FAF6F0] dark:bg-[#35302C] p-4 rounded-2xl border border-[#EFEAE2] dark:border-[#433B35] flex flex-col gap-3">
                        <p class="text-xs text-zinc-500 dark:text-zinc-400 leading-relaxed">基于 V9 Engine，网页端即刻完成 4K 级纯前端无损渲染输出。</p>

        <nav id="bottom-nav-bar">
            <button class="tab-btn" data-pane-target="photo"><i data-lucide="image" class="w-5 h-5"></i><span>素材</span></button>
            <button class="tab-btn active" data-pane-target="style"><i data-lucide="palette" class="w-5 h-5"></i><span>模式</span></button>
            <button class="tab-btn" data-pane-target="text"><i data-lucide="type" class="w-5 h-5"></i><span>文字</span></button>
            <button class="tab-btn" data-pane-target="share"><i data-lucide="share-2" class="w-5 h-5"></i><span>导出</span></button>
        </nav>
    </div>

    <canvas id="export-canvas" class="hidden"></canvas>

    <div id="mobile-download-modal" class="fixed inset-0 bg-black/85 z-50 flex flex-col items-center justify-center p-6 transition-all duration-300 opacity-0 pointer-events-none">
        <button id="btn-close-modal" class="absolute top-6 right-6 text-zinc-400 hover:text-white bg-zinc-800/80 p-2.5 rounded-full cream-button"><i data-lucide="x" class="w-6 h-6"></i></button>
        <div class="text-center max-w-sm flex flex-col items-center gap-4">
            <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded-full flex items-center justify-center"><i data-lucide="sparkles" class="w-6 h-6"></i></div>
            <div>
                <h3 class="text-base font-bold text-white">长按保存至相册</h3>
                <p class="text-xs text-zinc-400 mt-1">系统已通过 V9 Engine 完成离线超清渲染</p>
            </div>
            <div class="relative bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-2xl max-h-[55vh] max-w-full">
                <img id="modal-download-img" class="w-auto h-auto max-h-[50vh] mx-auto object-contain select-all" src="" alt="长按保存图片">
            </div>
        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT: V9 CORE ARCHITECTURE
         ========================================== -->
    <script>
        /**
         * [ 模块 1: 工具库 Utils ]
         * 纯函数，数学运算与日期格式化
         */
        const Utils = {
            formatDate(dateStr, format) {
                if (!dateStr) return ""; const d = new Date(dateStr); if (isNaN(d)) return "";
                const yyyy = d.getFullYear(), mm = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
                const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                const monthFull = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                if (format === 'DD MMM YYYY') return `${dd} ${months[d.getMonth()]} ${yyyy}`;
                if (format === 'YYYY.MM.DD') return `${yyyy}.${mm}.${dd}`;
                if (format === 'MM/DD/YYYY') return `${mm}/${dd}/${yyyy}`;
                if (format === 'Month DD, YYYY') return `${monthFull[d.getMonth()]} ${dd}, ${yyyy}`;
                return dateStr;
            },
            getToday() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; },
            deepClone(obj) { return JSON.parse(JSON.stringify(obj)); },
            getValueByPath(obj, path) { return path.split('.').reduce((acc, part) => acc && acc[part], obj); },
            setValueByPath(obj, path, value) {
                const parts = path.split('.'); const last = parts.pop();
                const target = parts.reduce((acc, part) => { if (!acc[part]) acc[part] = {}; return acc[part]; }, obj);
                target[last] = value;
            },
            drawRoundedRect(ctx, x, y, w, h, r) {
                if(r<=0) { ctx.rect(x,y,w,h); return; }
                ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
                ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
                ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
                ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
            }
        };

        /**
         * [ 模块 2: 图片管理器 ImageManager ]
         * 负责所有图片的加载、缓存，使得 State 只需存储 String ID，彻底解决内存泄漏与序列化问题。
         */
        const ImageManager = {
            cache: new Map(), // Map<String, HTMLImageElement>
            async loadFromFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const id = 'img_' + Math.random().toString(36).substr(2, 9);
                            this.cache.set(id, img);
                            resolve(id);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            },
            async loadFromUrl(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        const id = 'url_' + Math.random().toString(36).substr(2, 9);
                        this.cache.set(id, img);
                        resolve({ id, img });
                    };
                    img.onerror = reject;
                    img.src = url;
                });
            },
            get(id) { return id ? this.cache.get(id) : null; }
        };

        /**
         * [ 模块 3: 状态中心 State & History ]
         * 单一事实数据源。严格遵守: State -> 改变 -> 压入History -> 通知UI更新与Render
         */
        let AppState = {
            mode: 'story', // 'story', 'inverse'
            ratio: '9-16', // '1-1', '3-4', '9-16'
            activeLayer: 'storyBg',
            settings: { centerSize: 55, gridGap: 2, radius: 0, grain: 6, borderWidth: 0, borderColor: '#FFFFFF' },
            text: {
                date: { show: true, raw: Utils.getToday(), format: 'DD MMM YYYY', offset: { x: 50, y: 32 } },
                free: { show: true, text: 'SHANGHAI // SEA & SUN', fontFamily: 'Cinzel', fontSize: 7, color: '#FFFFFF', shadowBlur: 6, offset: { x: 50, y: 82 } }
            },
            layers: {
                inverse: {
                    topBg: { imgId: null, offset: {x:50, y:50}, scale: 1 },
                    topFg: { imgId: null, offset: {x:50, y:50}, scale: 1 },
                    bottomBg: { imgId: null, offset: {x:50, y:50}, scale: 1 },
                    bottomFg: { imgId: null, offset: {x:50, y:50}, scale: 1 }
                },
                story: {
                    layout: '2-2', 
                    bg: { imgId: null, offset: {x:50,y:50}, scale: 1 },
                    cells: Array(6).fill(null).map(() => ({ imgId: null, offset: {x:50,y:50}, scale: 1 }))
                }
            }
        };

        const Store = {
            history: [], pointer: -1, maxSize: 20,
            
            // 唯一修改状态的方法。传入回调函数操作状态。
            commit(mutationFn, pushHistory = true) {
                mutationFn(AppState);
                if (pushHistory) this.saveSnapshot();
                // 状态变更后自动派发重新渲染
                Engine.requestRender();
                UIBinder.syncStateToDOM();
            },
            saveSnapshot() {
                if (this.pointer < this.history.length - 1) {
                    this.history = this.history.slice(0, this.pointer + 1);
                }
                this.history.push(Utils.deepClone(AppState));
                if (this.history.length > this.maxSize) this.history.shift();
                else this.pointer++;
                this.updateButtons();
            },
            undo() { if (this.pointer > 0) { this.pointer--; this.restore(); } },
            redo() { if (this.pointer < this.history.length - 1) { this.pointer++; this.restore(); } },
            restore() {
                AppState = Utils.deepClone(this.history[this.pointer]);
                Engine.requestRender();
                UIBinder.syncStateToDOM();
                this.updateButtons();
            },
            updateButtons() {
                document.getElementById('btn-undo').disabled = (this.pointer <= 0);
                document.getElementById('btn-redo').disabled = (this.pointer >= this.history.length - 1);
            }
        };

        /**
         * [ 模块 4: 渲染模式系统 Mode System ]
         * 插件化架构：每个模式独立负责自己的绘制与点击测试，不污染核心引擎。
         */
        const ModeManager = {
            modes: {},
            register(name, modeObj) { this.modes[name] = modeObj; },
            get(name) { return this.modes[name]; },
            
            // 辅助：通用图层绘制
            drawLayerImage(ctx, img, x, y, w, h, offset, scale) {
                if (!img) return;
                const imgRatio = img.width / img.height, destRatio = w / h;
                let drawW, drawH;
                if (imgRatio > destRatio) { drawH = h * scale; drawW = h * imgRatio * scale; } 
                else { drawW = w * scale; drawH = w / imgRatio * scale; }
                const drawX = x + (w - drawW) * (offset.x / 100);
                const drawY = y + (h - drawH) * (offset.y / 100);
                ctx.drawImage(img, drawX, drawY, drawW, drawH);
            },
            // 辅助：嵌套圆角卡片绘制
            drawNestedBox(ctx, img, x, y, w, h, radius, border, borderColor, offset, scale, canvasWidth) {
                ctx.save();
                ctx.shadowColor = 'rgba(139, 115, 85, 0.22)';
                ctx.shadowBlur = 30 * (canvasWidth / 1200); ctx.shadowOffsetY = 8 * (canvasWidth / 1200);
                ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); Utils.drawRoundedRect(ctx, x, y, w, h, radius); ctx.fill();
                ctx.restore();
                if (img) {
                    ctx.save(); ctx.beginPath(); Utils.drawRoundedRect(ctx, x, y, w, h, radius); ctx.clip();
                    this.drawLayerImage(ctx, img, x, y, w, h, offset, scale); ctx.restore();
                }
                if (border > 0) {
                    ctx.save(); ctx.strokeStyle = borderColor; ctx.lineWidth = border;
                    ctx.beginPath(); Utils.drawRoundedRect(ctx, x, y, w, h, radius); ctx.stroke(); ctx.restore();
                }
            }
        };

        // -> 注册: Inverse 镜像模式
        ModeManager.register('inverse', {
            render(ctx, state, w, h) {
                const midY = h / 2, layers = state.layers.inverse;
                const imgTopBg = ImageManager.get(layers.topBg.imgId), imgBottomBg = ImageManager.get(layers.bottomBg.imgId);
                const imgTopFg = ImageManager.get(layers.topFg.imgId), imgBottomFg = ImageManager.get(layers.bottomFg.imgId);

                ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, midY); ctx.clip();
                ModeManager.drawLayerImage(ctx, imgTopBg, 0, 0, w, midY, layers.topBg.offset, layers.topBg.scale); ctx.restore();

                ctx.save(); ctx.beginPath(); ctx.rect(0, midY, w, midY); ctx.clip();
                ModeManager.drawLayerImage(ctx, imgBottomBg, 0, midY, w, midY, layers.bottomBg.offset, layers.bottomBg.scale); ctx.restore();

                const boxW = w * (state.settings.centerSize / 100), radius = state.settings.radius * (w/320), border = state.settings.borderWidth * (w/320);
                ModeManager.drawNestedBox(ctx, imgTopFg, w/2 - boxW/2, midY/2 - boxW/2, boxW, boxW, radius, border, state.settings.borderColor, layers.topFg.offset, layers.topFg.scale, w);
                ModeManager.drawNestedBox(ctx, imgBottomFg, w/2 - boxW/2, midY + midY/2 - boxW/2, boxW, boxW, radius, border, state.settings.borderColor, layers.bottomFg.offset, layers.bottomFg.scale, w);
            },
            hitTest(x, y, state, w, h) {
                const midY = h / 2;
                return y < midY ? 'inverseTop' : 'inverseBottom';
            },
            getActiveTarget(layerName, state) {
                if(layerName === 'inverseTop') return { ref: state.layers.inverse.topFg, sync: [state.layers.inverse.bottomBg] };
                if(layerName === 'inverseBottom') return { ref: state.layers.inverse.bottomFg, sync: [state.layers.inverse.topBg] };
                return null;
            }
        });

        // -> 注册: Story 拼图模式
        ModeManager.register('story', {
            getGridData(state, w, h) {
                const layout = state.layers.story.layout;
                const gridW = w * (state.settings.centerSize / 100);
                const gap = state.settings.gridGap * (w / 320);
                let cols = 2, rows = 2;
                if (layout === '1') { cols = 1; rows = 1; } else if (layout === '2-v') { cols = 1; rows = 2; } else if (layout === '2-3') { cols = 2; rows = 3; }
                const gridH = gridW * (rows / cols);
                const startX = w/2 - gridW/2, startY = h/2 - gridH/2;
                const cellW = (gridW - (cols-1)*gap)/cols, cellH = (gridH - (rows-1)*gap)/rows;
                return { cols, rows, startX, startY, cellW, cellH, gap };
            },
            render(ctx, state, w, h) {
                const st = state.layers.story, bgImg = ImageManager.get(st.bg.imgId);
                if (bgImg) {
                    ctx.save(); ModeManager.drawLayerImage(ctx, bgImg, 0, 0, w, h, st.bg.offset, st.bg.scale); ctx.restore();
                } else { ctx.fillStyle = '#2D3748'; ctx.fillRect(0, 0, w, h); }

                const grid = this.getGridData(state, w, h);
                const radius = state.settings.radius * (w/320), border = state.settings.borderWidth * (w/320);
                
                let idx = 0;
                for (let r=0; r<grid.rows; r++) {
                    for (let c=0; c<grid.cols; c++) {
                        const cx = grid.startX + c * (grid.cellW + grid.gap), cy = grid.startY + r * (grid.cellH + grid.gap);
                        const cell = st.cells[idx], img = ImageManager.get(cell.imgId);
                        ModeManager.drawNestedBox(ctx, img, cx, cy, grid.cellW, grid.cellH, radius, border, state.settings.borderColor, cell.offset, cell.scale, w);
                        idx++;
                    }
                }
            },
            hitTest(x, y, state, w, h) {
                const grid = this.getGridData(state, w, h);
                let idx = 0;
                for (let r=0; r<grid.rows; r++) {
                    for (let c=0; c<grid.cols; c++) {
                        const cx = grid.startX + c * (grid.cellW + grid.gap), cy = grid.startY + r * (grid.cellH + grid.gap);
                        if (x >= cx && x <= cx + grid.cellW && y >= cy && y <= cy + grid.cellH) return `storyCell_${idx}`;
                        idx++;
                    }
                }
                return 'storyBg';
            },
            getActiveTarget(layerName, state) {
                if (layerName === 'storyBg') return { ref: state.layers.story.bg, sync: [] };
                if (layerName.startsWith('storyCell_')) return { ref: state.layers.story.cells[parseInt(layerName.split('_')[1])], sync: [] };
                return null;
            }
        });

        // -> 特殊注册: 文本渲染层
        const TextModule = {
            render(ctx, state, w, h, isExport) {
                const d = state.text.date, t = state.text.free;
                // 日期
                if (d.show && d.raw) {
                    const textStr = Utils.formatDate(d.raw, d.format);
                    const baseSize = w * 0.042; const x = w * (d.offset.x/100), y = h * (d.offset.y/100);
                    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    if (t.shadowBlur > 0) { ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = t.shadowBlur * (w/320); ctx.shadowOffsetY = 2 * (w/320); }
                    ctx.fillStyle = t.color; ctx.font = `600 ${baseSize}px "Cinzel", "Inter", serif`;
                    ctx.fillText(textStr, x, y);
                    if (!isExport && state.activeLayer === 'dateLayer') {
                        ctx.shadowColor = 'transparent'; ctx.strokeStyle = '#70FFFF'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
                        ctx.strokeRect(x - baseSize*5, y - baseSize*0.8, baseSize*10, baseSize*1.6);
                    }
                    ctx.restore();
                }
                // 自由文本
                if (t.show && t.text) {
                    const baseSize = w * (t.fontSize/100); const x = w * (t.offset.x/100), y = h * (t.offset.y/100);
                    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    if (t.shadowBlur > 0) { ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = t.shadowBlur * (w/320); ctx.shadowOffsetY = 2 * (w/320); }
                    ctx.fillStyle = t.color; ctx.font = `500 ${baseSize}px "${t.fontFamily}", "Caveat", "Inter", sans-serif`;
                    ctx.fillText(t.text, x, y);
                    if (!isExport && state.activeLayer === 'textLayer') {
                        ctx.shadowColor = 'transparent'; ctx.strokeStyle = '#70FFFF'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
                        ctx.strokeRect(x - baseSize*6, y - baseSize*0.8, baseSize*12, baseSize*1.6);
                    }
                    ctx.restore();
                }
            },
            hitTest(x, y, state, w, h) {
                const dx = w*(state.text.date.offset.x/100), dy = h*(state.text.date.offset.y/100);
                if (state.text.date.show && Math.abs(x-dx)<80 && Math.abs(y-dy)<20) return 'dateLayer';
                const tx = w*(state.text.free.offset.x/100), ty = h*(state.text.free.offset.y/100);
                if (state.text.free.show && Math.abs(x-tx)<100 && Math.abs(y-ty)<20) return 'textLayer';
                return null;
            },
            getActiveTarget(layerName, state) {
                if (layerName === 'dateLayer') return { ref: state.text.date, sync: [], isText: true, getScale: ()=>1, setScale: ()=>{} };
                if (layerName === 'textLayer') return { ref: state.text.free, sync: [], isText: true, getScale: ()=>state.text.free.fontSize/7, setScale: (v)=>{ state.text.free.fontSize=v*7; } };
                return null;
            }
        };


        /**
         * [ 模块 5: 核心渲染引擎 RenderEngine ]
         * 唯一负责绘图的入口。解决网页端和导出端的代码重复。
         */
        const Engine = {
            ctx: null, canvas: null, isPendingRender: false,
            init() {
                this.canvas = document.getElementById('preview-canvas');
                this.ctx = this.canvas.getContext('2d');
            },
            requestRender() {
                if (this.isPendingRender) return;
                this.isPendingRender = true;
                requestAnimationFrame(() => {
                    this.drawPreview();
                    this.isPendingRender = false;
                });
            },
            drawPreview() {
                const ws = document.getElementById('workspace');
                const dpr = window.devicePixelRatio || 1;
                const rect = ws.getBoundingClientRect();
                this.canvas.width = rect.width * dpr; this.canvas.height = rect.height * dpr;
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                
                this.coreDraw(this.ctx, AppState, rect.width, rect.height, false);
                this.updatePlaceholder(AppState);
            },
            coreDraw(ctx, state, w, h, isExport) {
                if (ctx.resetTransform) ctx.resetTransform(); else ctx.setTransform(1,0,0,1,0,0);
                ctx.clearRect(0, 0, w, h);
                
                // 1. 调用对应模式渲染
                const mode = ModeManager.get(state.mode);
                if (mode) mode.render(ctx, state, w, h);

                // 2. 文本层渲染
                TextModule.render(ctx, state, w, h, isExport);

                // 3. 全局噪点渲染
                if (state.settings.grain > 0) {
                    ctx.save(); ctx.fillStyle = `rgba(255, 255, 255, ${state.settings.grain / 100})`;
                    for (let i = 0; i < w; i += 3) {
                        for (let j = 0; j < h; j += 3) {
                            if (Math.random() > 0.5) ctx.fillRect(i, j, 1.5, 1.5);
                        }
                    }
                    ctx.restore();
                }
            },
            updatePlaceholder(state) {
                const placeholder = document.getElementById('workspace-placeholder');
                let hasImages = false;
                if (state.mode === 'inverse') hasImages = state.layers.inverse.topFg.imgId || state.layers.inverse.bottomFg.imgId;
                else hasImages = state.layers.story.bg.imgId || state.layers.story.cells.some(c => c.imgId);
                if (hasImages) placeholder.classList.add('opacity-0', 'pointer-events-none');
                else placeholder.classList.remove('opacity-0', 'pointer-events-none');
            },
            exportRender() {
                const state = AppState;
                let outW = 1440, outH = 2560;
                if (state.ratio === '1-1') { outW = 1600; outH = 1600; }
                else if (state.ratio === '3-4') { outW = 1600; outH = 2133; }

                const expCanvas = document.getElementById('export-canvas');
                expCanvas.width = outW; expCanvas.height = outH;
                const ctx = expCanvas.getContext('2d');
                
                // 完全复用引擎核心
                this.coreDraw(ctx, state, outW, outH, true);
                return expCanvas.toDataURL('image/png');
            }
        };


        /**
         * [ 模块 6: UI 抽屉管理器 UIDrawer ]
         * 独立管理 Bottom Sheet 的手势与物理逻辑。
         */
        const UIDrawer = {
            panel: null, icon: null, startY: 0, startH: 0,
            init() {
                this.panel = document.getElementById('editor-panel');
                this.icon = document.getElementById('handle-icon');
                const handle = document.getElementById('editor-handle-bar');
                
                handle.addEventListener('click', () => this.toggle());
                
                const onStart = (y) => { this.startY = y; this.startH = this.panel.offsetHeight; };
                const onMove = (y) => {
                    const dy = this.startY - y;
                    const newHeight = Math.max(60, Math.min(window.innerHeight - 80, this.startH + dy));
                    this.panel.style.height = newHeight + 'px';
                    this.icon.style.transform = newHeight < 120 ? 'rotate(180deg)' : 'rotate(0deg)';
                };
                
                handle.addEventListener('mousedown', (e) => { e.stopPropagation(); onStart(e.clientY); const move = ev => onMove(ev.clientY); const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); }; window.addEventListener('mousemove', move); window.addEventListener('mouseup', up); });
                handle.addEventListener('touchstart', (e) => { e.stopPropagation(); onStart(e.touches[0].clientY); const move = ev => onMove(ev.touches[0].clientY); const up = () => { window.removeEventListener('touchmove', move); window.removeEventListener('touchend', up); }; window.addEventListener('touchmove', move); window.addEventListener('touchend', up); }, { passive: true });
            },
            toggle() {
                if (this.panel.offsetHeight > 120) { this.panel.style.height = '60px'; this.icon.style.transform = 'rotate(180deg)'; }
                else { this.panel.style.height = '44vh'; this.icon.style.transform = 'rotate(0deg)'; }
            },
            open() {
                if (this.panel.offsetHeight < 120) { this.panel.style.height = '44vh'; this.icon.style.transform = 'rotate(0deg)'; }
            }
        };

        /**
         * [ 模块 7: 交互与手势 Gestures ]
         * 基于策略模式，动态分发点击事件到相应的 Mode 进行命中测试。
         */
        const Gestures = {
            isDragging: false, startX: 0, startY: 0, initOffset: null, initScale: 1, startDist: 0,
            init() {
                const canvas = document.getElementById('preview-canvas');
                
                const detectLayer = (x, y) => {
                    const rect = canvas.getBoundingClientRect(), cx = x - rect.left, cy = y - rect.top;
                    // 1. Text overrides everything
                    let target = TextModule.hitTest(cx, cy, AppState, rect.width, rect.height);
                    // 2. Mode specific
                    if (!target) {
                        const mode = ModeManager.get(AppState.mode);
                        if (mode && mode.hitTest) target = mode.hitTest(cx, cy, AppState, rect.width, rect.height);
                    }
                    return target || 'storyBg';
                };

                const getTargetObj = (layerName) => {
                    let target = TextModule.getActiveTarget(layerName, AppState);
                    if (!target) {
                        const mode = ModeManager.get(AppState.mode);
                        if (mode && mode.getActiveTarget) target = mode.getActiveTarget(layerName, AppState);
                    }
                    return target;
                };

                const getTouchDist = (touches) => Math.sqrt(Math.pow(touches[0].clientX - touches[1].clientX, 2) + Math.pow(touches[0].clientY - touches[1].clientY, 2));

                const onStart = (e) => {
                    const pt = e.touches ? e.touches[0] : e;
                    const targetName = detectLayer(pt.clientX, pt.clientY);
                    
                    // State commit to update active layer
                    Store.commit(state => { state.activeLayer = targetName; }, false);
                    this.isDragging = true;
                    
                    const tObj = getTargetObj(targetName);
                    if (!tObj) return;

                    if (e.touches && e.touches.length === 2) {
                        this.startDist = getTouchDist(e.touches);
                        this.initScale = tObj.isText ? tObj.getScale() : tObj.ref.scale;
                        return;
                    }
                    this.startX = pt.clientX; this.startY = pt.clientY;
                    this.initOffset = { ...tObj.ref.offset };
                };

                const onMove = (e) => {
                    if (!this.isDragging) return;
                    if (e.cancelable) e.preventDefault();
                    
                    const tObj = getTargetObj(AppState.activeLayer);
                    if (!tObj) return;

                    if (e.touches && e.touches.length === 2) {
                        const dist = getTouchDist(e.touches);
                        const newScale = Math.max(0.5, Math.min(3.0, this.initScale * (dist / this.startDist)));
                        Store.commit(state => {
                            const currentTarget = getTargetObj(state.activeLayer);
                            if (currentTarget.isText) currentTarget.setScale(newScale);
                            else {
                                currentTarget.ref.scale = newScale;
                                currentTarget.sync.forEach(s => s.scale = newScale);
                            }
                        }, false);
                        return;
                    }

                    const pt = e.touches ? e.touches[0] : e;
                    const dx = pt.clientX - this.startX, dy = pt.clientY - this.startY;
                    const wsW = parseFloat(document.getElementById('workspace').style.width || 320);
                    
                    let chgX, chgY;
                    const curScale = tObj.isText ? tObj.getScale() : tObj.ref.scale;
                    if (tObj.isText) { chgX = -(dx / wsW) * 100; chgY = -(dy / (wsW * 1.7)) * 100; }
                    else { chgX = (dx / (wsW * 0.8)) * 100 / curScale; chgY = (dy / (wsW * 0.4)) * 100 / curScale; }

                    Store.commit(state => {
                        const currentTarget = getTargetObj(state.activeLayer);
                        const nx = Math.max(0, Math.min(100, this.initOffset.x - chgX));
                        const ny = Math.max(0, Math.min(100, this.initOffset.y - chgY));
                        currentTarget.ref.offset = { x: nx, y: ny };
                        currentTarget.sync.forEach(s => s.offset = { x: nx, y: ny });
                    }, false);
                };

                const onEnd = () => { if (this.isDragging) { this.isDragging = false; Store.saveSnapshot(); } };
                
                const onWheel = (e) => {
                    e.preventDefault();
                    const targetName = detectLayer(e.clientX, e.clientY);
                    Store.commit(state => { state.activeLayer = targetName; }, false);
                    const tObj = getTargetObj(targetName);
                    if (tObj && tObj.isText) {
                        Store.commit(state => {
                            const curTarget = getTargetObj(state.activeLayer);
                            curTarget.setScale(Math.max(0.5, Math.min(3.0, curTarget.getScale() - e.deltaY * 0.0015)));
                        });
                    }
                };

                canvas.addEventListener('mousedown', onStart); canvas.addEventListener('touchstart', onStart, { passive: true });
                canvas.addEventListener('touchmove', onMove, { passive: false }); canvas.addEventListener('wheel', onWheel, { passive: false });
                window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onEnd); window.addEventListener('touchend', onEnd);
            }
        };

        /**
         * [ 模块 8: UI 绑定与业务逻辑 UIBinder ]
         */
        const UIBinder = {
            init() {
                // 1. Data-State-Key 数据双向绑定
                document.querySelectorAll('[data-state-key]').forEach(el => {
                    const evt = (el.type === 'range' || el.type === 'color' || el.type === 'text') ? 'input' : 'change';
                    el.addEventListener(evt, (e) => {
                        Store.commit(state => {
                            let val = e.target.value;
                            if (e.target.type === 'checkbox') val = e.target.checked;
                            if (e.target.type === 'range' || e.target.type === 'number') val = parseFloat(val);
                            Utils.setValueByPath(state, el.dataset.stateKey, val);
                        });
                    });
                });

                // 2. Theme
                document.getElementById('btn-theme-toggle').addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                    localStorage.setItem('riyad_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
                });
                if (localStorage.getItem('riyad_theme') === 'dark' || (!localStorage.getItem('riyad_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }

                // 3. Tabs
                const tabButtons = document.querySelectorAll('.tab-btn');
                const tabPanes = document.querySelectorAll('.tab-pane');
                tabButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        UIDrawer.open();
                        tabButtons.forEach(b => b.classList.remove('active')); btn.classList.add('active');
                        tabPanes.forEach(pane => {
                            if (pane.dataset.pane === btn.dataset.paneTarget) pane.classList.remove('hidden');
                            else pane.classList.add('hidden');
                        });
                    });
                });
                
                // 4. Buttons (Mode & Layouts)
                document.querySelectorAll('.btn-mode').forEach(btn => btn.addEventListener('click', () => {
                    Store.commit(state => {
                        state.mode = btn.dataset.mode;
                        // Mode specific resets
                        state.ratio = state.mode === 'inverse' ? '1-1' : '9-16';
                        state.activeLayer = 'textLayer';
                    });
                    this.updateModeUI();
                }));

                document.querySelectorAll('.btn-story-layout').forEach(btn => btn.addEventListener('click', () => {
                    Store.commit(state => { state.layers.story.layout = btn.dataset.layout; });
                }));

                // 5. Uploaders
                const handleUpload = async (id, assignFn) => {
                    document.getElementById(id).addEventListener('change', async (e) => {
                        const file = e.target.files[0]; if (!file) return;
                        const imgId = await ImageManager.loadFromFile(file);
                        Store.commit(state => assignFn(state, imgId));
                        if(id.startsWith('upload-a')||id.startsWith('upload-b')){
                            const isA = id.includes('a');
                            const imgUrl = URL.createObjectURL(file);
                            document.getElementById(`img-thumb-${isA?'a':'b'}`).src = imgUrl;
                            document.getElementById(`preview-container-${isA?'a':'b'}`).classList.remove('hidden');
                            document.getElementById(`placeholder-${isA?'a':'b'}`).classList.add('hidden');
                        }
                    });
                };
                
                handleUpload('upload-a', (state, id) => {
                    state.layers.inverse.topBg.imgId = id; state.layers.inverse.bottomFg.imgId = id;
                });
                handleUpload('upload-b', (state, id) => {
                    state.layers.inverse.topFg.imgId = id; state.layers.inverse.bottomBg.imgId = id;
                });
                handleUpload('upload-story-bg', (state, id) => { state.layers.story.bg.imgId = id; document.getElementById('story-bg-status').textContent="已就绪"; });
                
                document.getElementById('upload-story-grid-multi').addEventListener('change', async (e) => {
                    const files = Array.from(e.target.files); if(!files.length) return;
                    for (let i = 0; i < Math.min(files.length, 6); i++) {
                        const imgId = await ImageManager.loadFromFile(files[i]);
                        Store.commit(state => { state.layers.story.cells[i].imgId = imgId; }, i === Math.min(files.length, 6)-1);
                    }
                });

                // 6. Text Quick Positions
                document.querySelectorAll('.btn-text-pos').forEach(btn => btn.addEventListener('click', () => {
                    Store.commit(state => {
                        const pos = btn.dataset.pos;
                        state.activeLayer = 'textLayer';
                        if (pos==='top') { state.text.date.offset = {x:50,y:8}; state.text.free.offset = {x:50,y:15}; }
                        else if (pos==='above') { state.text.date.offset = {x:50,y:25}; state.text.free.offset = {x:50,y:31}; }
                        else if (pos==='center') { state.text.date.offset = {x:50,y:45}; state.text.free.offset = {x:50,y:52}; }
                        else if (pos==='below') { state.text.date.offset = {x:50,y:68}; state.text.free.offset = {x:50,y:75}; }
                        else if (pos==='bottom') { state.text.date.offset = {x:50,y:88}; state.text.free.offset = {x:50,y:94}; }
                    });
                }));

                // 7. Actions
                document.getElementById('btn-undo').addEventListener('click', () => Store.undo());
                document.getElementById('btn-redo').addEventListener('click', () => Store.redo());
                window.addEventListener('resize', () => { this.adaptWorkspace(); Engine.requestRender(); });
                
                document.getElementById('btn-export').addEventListener('click', async () => {
                    const btn = document.getElementById('btn-export');
                    const origHTML = btn.innerHTML;
                    btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i><span class="text-xs">V9 Engine 渲染中...</span>`;
                    lucide.createIcons();
                    
                    setTimeout(() => {
                        const dataURL = Engine.exportRender();
                        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                        if (isMobile) {
                            document.getElementById('modal-download-img').src = dataURL;
                            document.getElementById('mobile-download-modal').classList.remove('opacity-0', 'pointer-events-none');
                        } else {
                            const link = document.createElement('a'); link.download = `riyad_v9_${Date.now()}.png`; link.href = dataURL; document.body.appendChild(link); link.click(); document.body.removeChild(link);
                        }
                        btn.innerHTML = origHTML; lucide.createIcons();
                    }, 100);
                });
                document.getElementById('btn-close-modal').addEventListener('click', () => document.getElementById('mobile-download-modal').classList.add('opacity-0', 'pointer-events-none'));
                
                document.getElementById('btn-sample-assets').addEventListener('click', async () => {
                    const res = await ImageManager.loadFromUrl("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80");
                    Store.commit(state => { state.layers.story.bg.imgId = res.id; document.getElementById('story-bg-status').textContent="已就绪"; });
                });
            },

            syncStateToDOM() {
                // UI View Synchronization mapped from State
                document.getElementById('val-centerSize').innerText = AppState.settings.centerSize + '%';
                document.getElementById('val-gridGap').innerText = AppState.settings.gridGap + 'px';
                document.getElementById('val-borderWidth').innerText = AppState.settings.borderWidth + 'px';
                document.getElementById('val-radius').innerText = AppState.settings.radius + 'px';
                document.getElementById('val-grain').innerText = AppState.settings.grain + '%';

                document.querySelectorAll('.btn-story-layout').forEach(btn => {
                    if (btn.dataset.layout === AppState.layers.story.layout) btn.className = "btn-story-layout py-1.5 text-xs rounded-xl bg-[#8B7355] dark:bg-[#70FFFF] dark:text-[#1E1B18] text-white font-bold shadow-sm";
                    else btn.className = "btn-story-layout py-1.5 text-xs rounded-xl bg-[#FAF6F0] dark:bg-[#35302C] text-[#4A3E3D] dark:text-[#EFEAE2] font-medium";
                });
                
                this.updateModeUI();
                this.rebuildStoryGridUI();
                this.adaptWorkspace();
            },

            updateModeUI() {
                const isInv = AppState.mode === 'inverse';
                document.querySelectorAll('.btn-mode').forEach(btn => {
                    if (btn.dataset.mode === AppState.mode) btn.className = "btn-mode py-2 px-2 text-xs rounded-xl bg-[#8B7355] dark:bg-[#70FFFF] dark:text-[#1E1B18] text-white font-bold transition-all cream-button shadow-sm flex items-center justify-center gap-1.5";
                    else btn.className = "btn-mode py-2 px-2 text-xs rounded-xl bg-[#FAF6F0] dark:bg-[#35302C] text-[#4A3E3D] dark:text-[#EFEAE2] font-bold transition-all cream-button flex items-center justify-center gap-1.5";
                });

                document.getElementById('panel-inverse-controls').classList.toggle('hidden', !isInv);
                document.getElementById('panel-story-controls').classList.toggle('hidden', isInv);
                document.getElementById('row-gridGap').classList.toggle('hidden', isInv);

                // Build Ratio cards
                const group = document.getElementById('ratio-cards-group'); group.innerHTML = '';
                const ratios = isInv ? ['1-1', '3-4', '9-16'] : ['9-16', '3-4', '1-1'];
                const meta = { "9-16": { n: "9:16", d: "Ins Story" }, "3-4": { n: "3:4", d: "经典海报" }, "1-1": { n: "1:1", d: "正方形" } };
                ratios.forEach(r => {
                    const btn = document.createElement('button');
                    const isActive = AppState.ratio === r;
                    btn.className = `p-2 rounded-xl border text-center transition-all cream-button flex flex-col items-center justify-center gap-0.5 ${isActive ? 'bg-[#8B7355] dark:bg-[#70FFFF] dark:text-[#1E1B18] text-white border-transparent font-bold shadow-sm' : 'bg-white dark:bg-[#282421] border-[#EFEAE2] dark:border-[#433B35] text-[#4A3E3D] dark:text-[#EFEAE2]'}`;
                    btn.innerHTML = `<span class="text-xs font-bold">${meta[r].n}</span><span class="text-[9px] opacity-75">${meta[r].d}</span>`;
                    btn.addEventListener('click', () => Store.commit(state => { state.ratio = r; }));
                    group.appendChild(btn);
                });
            },

            rebuildStoryGridUI() {
                const container = document.getElementById('story-grid-upload-cells'); container.innerHTML = '';
                let count = 4; const layout = AppState.layers.story.layout;
                if (layout === '1') count = 1; else if (layout === '2-v') count = 2; else if (layout === '2-3') count = 6;
                for (let i = 0; i < count; i++) {
                    const cellData = AppState.layers.story.cells[i];
                    const img = ImageManager.get(cellData.imgId);
                    const cell = document.createElement('div'); cell.className = "relative";
                    cell.innerHTML = `<input type="file" id="up-grid-${i}" accept="image/*" class="hidden"><label for="up-grid-${i}" class="flex flex-col items-center justify-center h-14 border border-dashed border-[#CBBFB0] dark:border-[#524942] hover:border-[#8B7355] dark:hover:border-[#70FFFF] rounded-xl cursor-pointer bg-[#FAF6F0] dark:bg-[#35302C] transition-all overflow-hidden relative">${img ? `<img src="${img.src}" class="absolute inset-0 w-full h-full object-cover">` : `<i data-lucide="plus" class="w-3.5 h-3.5 text-[#8B7355] dark:text-[#70FFFF]"></i><span class="text-[9px] font-medium mt-0.5">图 #${i+1}</span>`}</label>`;
                    container.appendChild(cell);
                    document.getElementById(`up-grid-${i}`).addEventListener('change', async (e) => {
                        const file = e.target.files[0]; if(!file) return;
                        const id = await ImageManager.loadFromFile(file);
                        Store.commit(state => { state.layers.story.cells[i].imgId = id; state.activeLayer = `storyCell_${i}`; });
                    });
                }
                lucide.createIcons();
            },

            adaptWorkspace() {
                const ws = document.getElementById('workspace'), container = ws.parentElement;
                let tw = 320, th = 568; 
                if (AppState.ratio === '1-1') { tw = 400; th = 400; } 
                else if (AppState.ratio === '3-4') { tw = 360; th = 480; }
                const scale = Math.min((container.clientWidth - 20) / tw, (container.clientHeight - 20) / th, 1.0);
                ws.style.width = `${tw * scale}px`; ws.style.height = `${th * scale}px`;
            }
        };

        /**
         * [ 模块 9: App Lifecycle ]
         */
        window.addEventListener('DOMContentLoaded', () => {
            // 模块初始化
            lucide.createIcons();
            Engine.init();
            UIDrawer.init();
            Gestures.init();
            UIBinder.init();

            // 首屏数据同步与快照
            UIBinder.syncStateToDOM();
            Store.saveSnapshot(); 
            setTimeout(() => { Engine.requestRender(); }, 100);
        });
    </script>
